[project]
name = "troupe"
version = "0.1.0"
description = "A team of AI agents that builds software with you."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Evan Ackmann", email = "evansbee@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.2.0",
    "raylib>=6.0.1.0",
    "ruamel-yaml>=0.19.1",
    "textual>=8.2.8",
]

[project.scripts]
troupe = "troupe:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
