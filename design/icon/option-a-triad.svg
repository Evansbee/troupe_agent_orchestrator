<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="38%" cy="28%" r="85%">
      <stop offset="0%" stop-color="#242b3e"/>
      <stop offset="60%" stop-color="#12141d"/>
      <stop offset="100%" stop-color="#090b10"/>
    </radialGradient>
    <filter id="glowSm" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="glowLg" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <radialGradient id="accent" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#c3caff"/>
      <stop offset="55%" stop-color="#7c8cff"/>
      <stop offset="100%" stop-color="#4a4fd6"/>
    </radialGradient>
    <radialGradient id="pink" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffd6ec"/>
      <stop offset="55%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#c23f8d"/>
    </radialGradient>
    <radialGradient id="green" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#c9ffe9"/>
      <stop offset="55%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#189d6b"/>
    </radialGradient>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="210" fill="url(#bg)"/>
  <rect x="33" y="33" width="958" height="958" rx="209" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>

  <!-- constellation lines -->
  <g stroke="#aab4ff" stroke-opacity="0.28" stroke-width="6" stroke-linecap="round">
    <line x1="512" y1="520" x2="512" y2="330"/>
    <line x1="512" y1="520" x2="352" y2="640"/>
    <line x1="512" y1="520" x2="672" y2="640"/>
  </g>

  <!-- center anchor (YOU) -->
  <circle cx="512" cy="520" r="70" fill="#e7eaf3" filter="url(#glowSm)" opacity="0.5"/>
  <circle cx="512" cy="520" r="46" fill="#f3f4f8"/>

  <!-- three role-colored orbs -->
  <circle cx="512" cy="330" r="160" fill="#7c8cff" filter="url(#glowLg)" opacity="0.5"/>
  <circle cx="512" cy="330" r="128" fill="url(#accent)"/>

  <circle cx="352" cy="640" r="150" fill="#f472b6" filter="url(#glowLg)" opacity="0.45"/>
  <circle cx="352" cy="640" r="118" fill="url(#pink)"/>

  <circle cx="672" cy="640" r="150" fill="#34d399" filter="url(#glowLg)" opacity="0.45"/>
  <circle cx="672" cy="640" r="118" fill="url(#green)"/>
</svg>
